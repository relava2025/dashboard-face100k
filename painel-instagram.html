<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagrams dos Clientes — FACE 100K</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, setDoc }
    from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyAyupUdCsEb6pPVmTs2clhayS84-TUovGA",
    authDomain:        "dashboard-e465d.firebaseapp.com",
    projectId:         "dashboard-e465d",
    storageBucket:     "dashboard-e465d.firebasestorage.app",
    messagingSenderId: "865986158280",
    appId:             "1:865986158280:web:1531d13630f9835a9f0ffd"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const PROCEDIMENTOS = ['Harmonização','Cirurgias','Botox','Preenchimento','Bichectomia','Rinomodelação','Fios de PDO','Lipo de Papada'];

  let allClients = [];
  let statusFilter = 'todos'; // todos | ativos | inativos

  function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function slugify(str){
    return str.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  }

  function handle(text) {
    try {
      const url = new URL(text);
      const parts = url.pathname.split('/').filter(Boolean);
      return parts.length ? '@' + parts[0] : text;
    } catch {
      return text.startsWith('@') ? text : '@' + text;
    }
  }

  function isAtivo(c){ return c.ativo !== false; } // default: ativo

  function render(list) {
    const grid = document.getElementById('ig-grid');
    const empty = document.getElementById('empty-state');
    const stTotal = document.getElementById('st-total');
    const stSem = document.getElementById('st-sem');
    const stAtivos = document.getElementById('st-ativos');

    // estatísticas sempre sobre o total (não sobre o filtro)
    const withIg = allClients.filter(c => c.ig && c.ig.trim());
    const withoutIg = allClients.filter(c => !c.ig || !c.ig.trim());
    stTotal.textContent = withIg.length;
    stSem.textContent = withoutIg.length;
    stAtivos.textContent = allClients.filter(isAtivo).length;

    if (!list.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    grid.innerHTML = list.map(c => {
      const temIg = !!(c.ig && c.ig.trim());
      const hdl = temIg ? handle(c.ig) : '';
      const url = temIg ? (c.ig.startsWith('http') ? c.ig : 'https://instagram.com/' + c.ig.replace('@','')) : '';
      const initials = (c.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      const ativo = isAtivo(c);
      const procs = Array.isArray(c.procedimentos) ? c.procedimentos : [];

      return `
      <div class="ig-card${ativo?'':' inativo'}">
        <div class="ig-card-top">
          <div class="ig-avatar">${esc(initials)}</div>
          <div class="ig-info">
            <div class="ig-nome">${esc(c.name||'—')}</div>
            <div class="ig-handle">${temIg ? esc(hdl) : '<span class="sem-ig">sem instagram</span>'}</div>
          </div>
          <span class="badge ${ativo?'badge-on':'badge-off'}">${ativo?'Ativo':'Inativo'}</span>
        </div>

        ${c.spec ? `<div class="ig-meta"><span class="meta-label">Nicho</span> ${esc(c.spec)}</div>` : ''}
        ${c.resp ? `<div class="ig-meta"><span class="meta-label">Gestor</span> ${esc(c.resp)}</div>` : ''}
        ${procs.length ? `<div class="proc-chips">${procs.map(p=>`<span class="proc-chip">${esc(p)}</span>`).join('')}</div>` : ''}
        ${c.contato ? `<div class="ig-meta"><span class="meta-label">Contato</span> ${esc(c.contato)}</div>` : ''}
        ${c.obs ? `<div class="ig-obs">${esc(c.obs)}</div>` : ''}

        <div class="ig-card-actions">
          ${temIg
            ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="btn-abrir">Abrir no Instagram</a>`
            : `<span class="btn-abrir disabled">Sem Instagram</span>`}
          <button class="btn-editar" onclick="editClient('${c.id}')">Editar</button>
        </div>
      </div>`;
    }).join('');
  }

  function applyFilters() {
    const q = (document.getElementById('search-input').value||'').toLowerCase().trim();
    let result = allClients;
    if (statusFilter === 'ativos')   result = result.filter(isAtivo);
    if (statusFilter === 'inativos') result = result.filter(c => !isAtivo(c));
    if (q) {
      result = result.filter(c =>
        (c.name||'').toLowerCase().includes(q) ||
        (c.ig||'').toLowerCase().includes(q) ||
        (c.spec||'').toLowerCase().includes(q) ||
        (c.resp||'').toLowerCase().includes(q) ||
        (Array.isArray(c.procedimentos)?c.procedimentos.join(' '):'').toLowerCase().includes(q)
      );
    }
    render(result);
  }
  window.applyFilters = applyFilters;

  window.setStatusFilter = function(val, btn){
    statusFilter = val;
    document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  };

  window.copyHandle = function(hdl, btn) {
    navigator.clipboard.writeText(hdl).then(() => {
      btn.classList.add('copied');
      setTimeout(() => btn.classList.remove('copied'), 1500);
    });
  };

  /* ---------- MODAL ---------- */
  let editingId = null;

  function buildProcOptions(selected){
    const sel = new Set(selected||[]);
    return PROCEDIMENTOS.map(p =>
      `<button type="button" class="proc-opt${sel.has(p)?' on':''}" data-proc="${esc(p)}" onclick="this.classList.toggle('on')">${esc(p)}</button>`
    ).join('');
  }

  window.openModal = function(client){
    editingId = client ? client.id : null;
    document.getElementById('modal-title').textContent = client ? 'Editar cliente' : 'Adicionar cliente';
    document.getElementById('f-name').value    = client?.name    || '';
    document.getElementById('f-ig').value       = client?.ig      || '';
    document.getElementById('f-spec').value    = client?.spec    || '';
    document.getElementById('f-contato').value = client?.contato || '';
    document.getElementById('f-obs').value     = client?.obs     || '';
    document.getElementById('f-ativo').checked = client ? (client.ativo !== false) : true;
    document.getElementById('f-procs').innerHTML = buildProcOptions(client?.procedimentos);
    document.getElementById('modal-error').textContent = '';
    document.getElementById('modal-overlay').classList.add('show');
    document.getElementById('f-name').focus();
  };

  window.editClient = function(id){
    const c = allClients.find(x => x.id === id);
    if (c) openModal(c);
  };

  window.closeModal = function(){
    document.getElementById('modal-overlay').classList.remove('show');
    editingId = null;
  };

  window.saveClient = async function(){
    const name    = document.getElementById('f-name').value.trim();
    const ig      = document.getElementById('f-ig').value.trim();
    const spec    = document.getElementById('f-spec').value.trim();
    const contato = document.getElementById('f-contato').value.trim();
    const obs     = document.getElementById('f-obs').value.trim();
    const ativo   = document.getElementById('f-ativo').checked;
    const procedimentos = Array.from(document.querySelectorAll('#f-procs .proc-opt.on')).map(b=>b.dataset.proc);

    const errEl = document.getElementById('modal-error');
    if (!name) { errEl.textContent = 'Informe o nome do cliente.'; return; }

    const btn = document.getElementById('btn-salvar');
    btn.disabled = true; btn.textContent = 'Salvando…';

    // grava apenas estes campos; merge:true preserva tasks/checklist/progress/startDate/waiting/etc. dos outros painéis
    const data = { name, ig, spec, contato, obs, ativo, procedimentos };
    const id = editingId || (slugify(name) + '-' + Date.now().toString(36));
    try {
      await setDoc(doc(db, "dashboards", id), data, { merge: true });
      closeModal();
    } catch (e) {
      errEl.textContent = 'Erro ao salvar: ' + (e?.message || e);
    } finally {
      btn.disabled = false; btn.textContent = 'Salvar';
    }
  };

  window.addEventListener('load', () => {
    onSnapshot(collection(db, "dashboards"), snap => {
      allClients = [];
      snap.forEach(d => allClients.push({ id: d.id, ...d.data() }));
      allClients.sort((a,b) => (a.name||'').localeCompare(b.name||''));
      document.getElementById('loading-screen').classList.add('hidden');
      applyFilters();
    }, err => {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('empty-state').style.display = 'block';
      document.querySelector('#empty-state .empty-title').textContent = 'Erro ao carregar: ' + err.message;
    });

    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target.id === 'modal-overlay') closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  });
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D1117;--surface:#1A2025;--surface2:#212830;
  --amber:#F5A623;--amber-dim:rgba(245,166,35,0.10);--amber-border:rgba(245,166,35,0.20);
  --border:#3E4249;--border-light:rgba(62,66,73,0.5);
  --text:#F0F0F0;--text-sec:#B8B8C0;--text-dim:rgba(255,255,255,0.25);
  --green:#22C55E;--green-dim:rgba(34,197,94,0.10);--green-border:rgba(34,197,94,0.22);
  --red:#EF4444;--red-dim:rgba(239,68,68,0.10);--red-border:rgba(239,68,68,0.22);
  --pink:#EC4899;--pink-dim:rgba(236,72,153,0.10);--pink-border:rgba(236,72,153,0.22);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(0deg,transparent 24%,rgba(245,166,35,0.03) 25%,rgba(245,166,35,0.03) 26%,transparent 27%),linear-gradient(90deg,transparent 24%,rgba(245,166,35,0.03) 25%,rgba(245,166,35,0.03) 26%,transparent 27%);background-size:50px 50px;pointer-events:none;z-index:0}

/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
.t-logo{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;color:var(--text)}
.t-logo span{color:var(--amber);font-style:italic}
.t-sep{width:1px;height:18px;background:var(--border)}
.t-sub{font-size:13px;color:var(--text-sec)}
.t-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn-back{background:transparent;color:var(--text-sec);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:13px;font-weight:600;font-family:'Montserrat',sans-serif;cursor:pointer;text-decoration:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-back:hover{border-color:var(--amber-border);color:var(--amber)}

/* CONTENT */
.content{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px 24px 60px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sc-pink::before{background:var(--pink)}
.sc-red::before{background:var(--red)}
.sc-green::before{background:var(--green)}
.stat-label{font-size:10px;color:var(--text-sec);text-transform:uppercase;letter-spacing:.14em;font-family:'Montserrat',sans-serif;font-weight:600;margin-bottom:8px}
.stat-val{font-size:32px;font-weight:800;font-family:'Montserrat',sans-serif;line-height:1}
.sv-pink{color:var(--pink)}.sv-red{color:var(--red)}.sv-green{color:var(--green)}
.stat-sub{font-size:11px;color:var(--text-sec);margin-top:5px}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.section-title{font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--text-sec)}
.filter-group{display:flex;gap:6px}
.filter-chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text-sec);font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;padding:7px 12px;cursor:pointer;transition:all .15s}
.filter-chip:hover{border-color:var(--amber-border);color:var(--text)}
.filter-chip.active{background:var(--amber-dim);border-color:var(--amber-border);color:var(--amber)}
.search-input{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:8px 12px;outline:none;transition:border-color .15s;width:220px;margin-left:auto}
.search-input:focus{border-color:var(--pink)}
.search-input::placeholder{color:var(--text-dim)}
.btn-add{background:var(--pink);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;letter-spacing:.03em;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-add:hover{filter:brightness(1.1)}

/* GRID */
.ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ig-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s,transform .18s;display:flex;flex-direction:column}
.ig-card:hover{border-color:var(--pink-border);transform:translateY(-2px)}
.ig-card.inativo{opacity:.6}
.ig-card-top{display:flex;align-items:center;gap:12px;padding:16px 18px 12px}
.ig-avatar{width:40px;height:40px;border-radius:50%;background:var(--pink-dim);border:1px solid var(--pink-border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--pink);font-family:'Montserrat',sans-serif;flex-shrink:0}
.ig-info{flex:1;min-width:0}
.ig-nome{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig-handle{font-size:12px;color:var(--text-sec);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sem-ig{color:var(--red);font-family:'Inter',sans-serif;font-style:italic}
.badge{font-size:10px;font-weight:700;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:20px;flex-shrink:0}
.badge-on{background:var(--green-dim);color:var(--green);border:1px solid var(--green-border)}
.badge-off{background:var(--red-dim);color:var(--red);border:1px solid var(--red-border)}
.ig-meta{font-size:12.5px;color:var(--text-sec);padding:0 18px;margin-bottom:6px}
.meta-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);font-family:'Montserrat',sans-serif;font-weight:600;margin-right:6px}
.proc-chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 18px;margin-bottom:8px}
.proc-chip{font-size:11px;background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber-border);border-radius:5px;padding:2px 7px;font-weight:500}
.ig-obs{font-size:12px;color:var(--text-sec);padding:0 18px;margin-bottom:10px;font-style:italic;line-height:1.45}
.ig-card-actions{padding:8px 18px 14px;margin-top:auto;display:flex;gap:8px}
.btn-abrir{flex:1;text-align:center;background:var(--pink-dim);color:var(--pink);border:1px solid var(--pink-border);border-radius:6px;padding:8px 0;font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;letter-spacing:.04em;text-decoration:none;transition:all .15s}
.btn-abrir:hover{background:var(--pink);color:#fff}
.btn-abrir.disabled{background:var(--surface2);color:var(--text-dim);border-color:var(--border);cursor:default}
.btn-editar{background:var(--surface2);color:var(--text-sec);border:1px solid var(--border);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;font-family:'Montserrat',sans-serif;cursor:pointer;transition:all .15s}
.btn-editar:hover{border-color:var(--amber-border);color:var(--amber)}

/* EMPTY */
.empty-state{display:none;text-align:center;padding:60px 20px;color:var(--text-sec)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;padding:24px;position:relative;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;color:var(--text)}
.modal-close{background:transparent;border:none;color:var(--text-sec);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.modal-close:hover{color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-sec);font-family:'Montserrat',sans-serif;font-weight:600;margin-bottom:6px}
.field input[type=text],.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:9px 12px;outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--pink)}
.field textarea{resize:vertical;min-height:72px}
.proc-grid{display:flex;flex-wrap:wrap;gap:6px}
.proc-opt{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text-sec);font-size:12.5px;font-family:'Inter',sans-serif;padding:6px 11px;cursor:pointer;transition:all .15s}
.proc-opt:hover{border-color:var(--amber-border)}
.proc-opt.on{background:var(--amber-dim);border-color:var(--amber-border);color:var(--amber);font-weight:600}
.switch-row{display:flex;align-items:center;gap:10px}
.switch-row input{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
.switch-row label{margin:0;text-transform:none;letter-spacing:0;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);cursor:pointer}
.modal-error{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.btn-cancelar{background:transparent;border:1px solid var(--border);color:var(--text-sec);border-radius:7px;padding:9px 18px;font-size:13px;font-weight:600;font-family:'Montserrat',sans-serif;cursor:pointer}
.btn-cancelar:hover{color:var(--text)}
.btn-salvar{background:var(--pink);border:none;color:#fff;border-radius:7px;padding:9px 22px;font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;transition:filter .15s}
.btn-salvar:hover{filter:brightness(1.1)}
.btn-salvar:disabled{opacity:.6;cursor:default}

/* LOADING */
#loading-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loading-screen.hidden{display:none}
.loading-logo{font-family:'Montserrat',sans-serif;font-size:23px;font-weight:800}
.loading-logo span{color:var(--amber);font-style:italic}
.loading-spinner{width:36px;height:36px;border:3px solid rgba(245,166,35,0.15);border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand-rail{height:2px;background:linear-gradient(90deg,rgba(245,166,35,0),var(--amber),rgba(245,166,35,0));margin-bottom:28px}

@media(max-width:700px){
  .stats-row{grid-template-columns:1fr 1fr}
  .topbar{padding:0 14px;gap:8px}
  .t-sub{display:none}
  .content{padding:16px 14px 40px}
  .toolbar{gap:8px}
  .search-input{width:100%;margin-left:0;order:5}
  .btn-add{order:4;margin-left:auto}
  .ig-grid{grid-template-columns:1fr}
  .stat-val{font-size:26px}
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">FACE <span>100K</span></div>
  <div class="loading-spinner"></div>
  <div style="font-size:14px;color:#A0A0A8">Carregando Instagrams...</div>
</div>

<div class="topbar">
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect width="22" height="22" rx="5" fill="#1A2025"/><path d="M5.5 7.5L11 6L16.5 7.5V13C16.5 16 14.2 17.8 11 18.5C7.8 17.8 5.5 16 5.5 13Z" stroke="#F5A623" stroke-width="1.3" fill="none"/><path d="M8.5 12L10.5 14L14.5 10" stroke="#F5A623" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="t-logo">FACE <span>100K</span></div>
  <div class="t-sep"></div>
  <div class="t-sub">Instagrams dos Clientes</div>
  <div class="t-right">
    <a href="index.html" class="btn-back">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 11L5 7l4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Central
    </a>
  </div>
</div>

<div class="content">
  <div class="brand-rail"></div>

  <div class="stats-row">
    <div class="stat-card sc-pink">
      <div class="stat-label">Com Instagram</div>
      <div class="stat-val sv-pink" id="st-total">—</div>
      <div class="stat-sub">perfis cadastrados</div>
    </div>
    <div class="stat-card sc-red">
      <div class="stat-label">Sem Instagram</div>
      <div class="stat-val sv-red" id="st-sem">—</div>
      <div class="stat-sub">pendentes</div>
    </div>
    <div class="stat-card sc-green">
      <div class="stat-label">Ativos</div>
      <div class="stat-val sv-green" id="st-ativos">—</div>
      <div class="stat-sub">clientes ativos</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="section-title">Perfis</div>
    <div class="filter-group">
      <button class="filter-chip active" onclick="setStatusFilter('todos', this)">Todos</button>
      <button class="filter-chip" onclick="setStatusFilter('ativos', this)">Ativos</button>
      <button class="filter-chip" onclick="setStatusFilter('inativos', this)">Inativos</button>
    </div>
    <button class="btn-add" onclick="openModal()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Adicionar
    </button>
    <input type="search" id="search-input" class="search-input" placeholder="Buscar por nome, @handle, nicho…">
  </div>

  <div class="ig-grid" id="ig-grid"></div>

  <div class="empty-state" id="empty-state">
    <div class="empty-icon">📷</div>
    <div class="empty-title">Nenhum resultado encontrado</div>
  </div>
</div>

<!-- MODAL ADICIONAR/EDITAR -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">Adicionar cliente</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>

    <div class="field">
      <label for="f-name">Nome do cliente</label>
      <input type="text" id="f-name" placeholder="Ex: Dr. João Silva">
    </div>
    <div class="field">
      <label for="f-ig">Instagram (link ou @handle)</label>
      <input type="text" id="f-ig" placeholder="@usuario ou https://instagram.com/usuario">
    </div>
    <div class="field">
      <label for="f-spec">Nicho / Especialidade</label>
      <input type="text" id="f-spec" placeholder="Ex: Cirurgia da Face, Dermatologia…">
    </div>
    <div class="field">
      <label>Procedimentos</label>
      <div class="proc-grid" id="f-procs"></div>
    </div>
    <div class="field">
      <label for="f-contato">Contato / Telefone</label>
      <input type="text" id="f-contato" placeholder="(00) 00000-0000">
    </div>
    <div class="field">
      <label for="f-obs">Observações</label>
      <textarea id="f-obs" placeholder="Anotações sobre o cliente…"></textarea>
    </div>
    <div class="field switch-row">
      <input type="checkbox" id="f-ativo" checked>
      <label for="f-ativo">Cliente ativo</label>
    </div>

    <div class="modal-error" id="modal-error"></div>
    <div class="modal-actions">
      <button class="btn-cancelar" onclick="closeModal()">Cancelar</button>
      <button class="btn-salvar" id="btn-salvar" onclick="saveClient()">Salvar</button>
    </div>
  </div>
</div>

</body>
</html>
